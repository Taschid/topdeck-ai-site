<!doctype html>
<html><head><meta charset="utf-8"><title>logo.svg (sub-pixel rebuild)</title>

<div class="row">
  <div>
    <div class="cap">logo.svg - the current build</div>
    <div class="panel dark"><img class="main" src="logo.svg"></div>
  </div>
  <div>
    <div class="cap">same file, zoomed into the canopy + highlight edge</div>
    <div class="panel dark"><img class="zoom" src="zoom.png"></div>
  </div>
  <div>
    <div class="cap">logo-dark.svg on light</div>
    <div class="panel light"><img class="main" src="logo-dark.svg"></div>
  </div>
</div>
