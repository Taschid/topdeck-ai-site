<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="AI receptionist answering a call and booking a job">
  <defs>
    <radialGradient id="sc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E4501C" stop-opacity=".30"/>
      <stop offset="1" stop-color="#E4501C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sc-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <!-- Animated variant used by card thumbnails. Media queries are unreliable
       inside SVG-as-image, so the preference guard lives on the <picture>
       source in the page instead. -->
  <style>
    .sc-ring { transform-box: fill-box; transform-origin: center; animation: sc-ring 1.8s ease-out infinite; }
    .sc-ring + .sc-ring { animation-delay: 0.6s; }
    .sc-bar { transform-box: fill-box; transform-origin: center; animation: sc-bar 0.6s ease-in-out infinite alternate; }
    .sc-bar:nth-child(2n) { animation-duration: 0.48s; }
    .sc-bar:nth-child(3n) { animation-delay: -0.18s; }
    .sc-bar:nth-child(4n) { animation-delay: -0.32s; animation-duration: 0.72s; }
    .sc-bar:nth-child(5n) { animation-delay: -0.1s; }
    .sc-dot { animation: sc-blink 1.2s steps(2, end) infinite; }
    .sc-check { transform-box: fill-box; transform-origin: center; animation: sc-pop 1.6s ease-in-out infinite; }
    @keyframes sc-ring { 0% { transform: scale(1); stroke-opacity: 0.5; } 100% { transform: scale(1.22); stroke-opacity: 0; } }
    @keyframes sc-bar { from { transform: scaleY(0.6); } to { transform: scaleY(1.45); } }
    @keyframes sc-blink { 50% { opacity: 0.25; } }
    @keyframes sc-pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>

  <rect width="800" height="560" fill="#101216"/>
  <rect width="800" height="560" fill="url(#sc-grid)"/>
  <circle cx="230" cy="250" r="270" fill="url(#sc-glow)"/>

  <rect x="48" y="48" width="704" height="464" rx="28" fill="#16181D" stroke="#262A31"/>

  <!-- live badge -->
  <rect x="610" y="76" width="114" height="36" rx="18" fill="#1E2023" stroke="#2E333B"/>
  <circle class="sc-dot" cx="632" cy="94" r="5" fill="#4ADE80"/>
  <text x="646" y="99" font-family="Roboto, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#C9CED6">24/7 LIVE</text>

  <!-- eyebrow -->
  <text x="88" y="103" font-family="Roboto, Arial, sans-serif" font-size="13" letter-spacing="4" fill="#5C636E">AI RECEPTIONIST</text>

  <!-- ringing rings -->
  <circle class="sc-ring" cx="190" cy="250" r="114" fill="none" stroke="#E4501C" stroke-opacity=".12"/>
  <circle class="sc-ring" cx="190" cy="250" r="86" fill="none" stroke="#E4501C" stroke-opacity=".28"/>

  <!-- handset -->
  <circle class="sc-phone" cx="190" cy="250" r="62" fill="#1E2023" stroke="#E4501C" stroke-width="2"/>
  <g transform="translate(166 226) scale(2)">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
          fill="none" stroke="#F7F4EE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- waveform -->
  <g fill="#E4501C">
    <rect class="sc-bar" x="298" y="242" width="8" height="16" rx="4" opacity=".35"/>
    <rect class="sc-bar" x="314" y="236" width="8" height="28" rx="4" opacity=".45"/>
    <rect class="sc-bar" x="330" y="228" width="8" height="44" rx="4" opacity=".60"/>
    <rect class="sc-bar" x="346" y="218" width="8" height="64" rx="4" opacity=".75"/>
    <rect class="sc-bar" x="362" y="231" width="8" height="38" rx="4" opacity=".55"/>
    <rect class="sc-bar" x="378" y="213" width="8" height="74" rx="4" opacity=".90"/>
    <rect class="sc-bar" x="394" y="224" width="8" height="52" rx="4" opacity=".70"/>
    <rect class="sc-bar" x="410" y="207" width="8" height="86" rx="4"/>
    <rect class="sc-bar" x="426" y="220" width="8" height="60" rx="4" opacity=".80"/>
    <rect class="sc-bar" x="442" y="230" width="8" height="40" rx="4" opacity=".60"/>
    <rect class="sc-bar" x="458" y="216" width="8" height="68" rx="4" opacity=".85"/>
    <rect class="sc-bar" x="474" y="233" width="8" height="34" rx="4" opacity=".50"/>
    <rect class="sc-bar" x="490" y="239" width="8" height="22" rx="4" opacity=".40"/>
    <rect class="sc-bar" x="506" y="244" width="8" height="12" rx="4" opacity=".30"/>
  </g>

  <!-- booking confirmation -->
  <rect class="sc-booking" x="298" y="330" width="334" height="92" rx="16" fill="#1E2023" stroke="#262A31"/>
  <circle class="sc-check" cx="338" cy="376" r="17" fill="#E4501C"/>
  <path d="M330.5 376.5l5 5 10-10" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="368" y="371" font-family="Roboto, Arial, sans-serif" font-size="18" fill="#F7F4EE">Job booked</text>
  <text x="368" y="395" font-family="Roboto, Arial, sans-serif" font-size="13" fill="#8A92A0">Tue 9:00 AM · Plumbing quote</text>

  <!-- footer line -->
  <text x="400" y="478" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="13" letter-spacing="1.6" fill="#5C636E">EVERY CALL ANSWERED. EVERY JOB BOOKED.</text>
</svg>
